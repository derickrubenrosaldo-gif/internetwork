{% extends "base.html" %}

{% block content %}
  <!-- PÁGINAS LEGALES -->
  <section class="legal" aria-label="{{ page.title }}">
    <div class="wrap legal-in">
      <div class="eyebrow reveal">Legal</div>
      <h1 class="reveal d1">{{ page.title }}</h1>
      <p class="legal-date reveal d2">Última actualización: {{ page.updated_at|date:"j F Y" }}</p>
      <div class="legal-body reveal d2">
        {% for paragraph in page.paragraphs %}
          <p>{{ paragraph }}</p>
        {% endfor %}
      </div>
    </div>
  </section>
{% endblock %}
