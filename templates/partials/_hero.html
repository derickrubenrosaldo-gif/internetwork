<!-- HERO: red 3D de nodos (Three.js) con fallback a canvas 2D -->
<section class="hero" id="inicio" aria-label="Inicio">
  <canvas id="net" aria-hidden="true"></canvas>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>
  <div class="hero-in" id="heroIn">
    <div class="eyebrow">{{ config.hero_eyebrow }}</div>
    <h1>{{ config.hero_title }} <span class="grad">{{ config.hero_title_highlight }}</span></h1>
    <p>{{ config.hero_subtitle }}</p>
    <div class="actions">
      <a class="btn" href="#contacto">Contrata tu internet</a>
      <a class="btn ghost" href="#historia">Conoce más</a>
    </div>
  </div>
  <div class="scroll-hint" aria-hidden="true">Desliza</div>
</section>
