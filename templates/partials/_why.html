<!-- POR QUÉ INTERNETWORK -->
<section class="why" id="nosotros" aria-label="Nosotros">
  <div class="wrap">
    <div class="eyebrow reveal">¿Por qué INTERNETWORK?</div>
    <h2 class="reveal d1">Tecnología confiable. <span class="grad">Atención cercana.</span></h2>
    <div class="why-grid">
      {% for item in differentiators %}
      <div class="why-item reveal{% cycle '' ' d1' ' d2' ' d3' %}">
        <b aria-hidden="true">{{ item.icon }}</b>
        <h3>{{ item.title }}</h3>
        <p>{{ item.text }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
