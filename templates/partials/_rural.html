<!-- ZONAS RURALES: parallax de capas con scrub -->
<section class="rural" id="rural" aria-label="Conectividad rural">
  <div class="hills" id="hills" aria-hidden="true">
    <svg viewBox="0 0 1440 400" preserveAspectRatio="none"><path d="M0 220C200 120 360 140 560 200S980 260 1180 160 1360 120 1440 150V400H0z" fill="#05352d" opacity=".7"/><path d="M0 290C240 210 440 250 700 300S1160 320 1440 250V400H0z" fill="#031f1b"/></svg>
  </div>
  <div class="rural-in">
    <div class="eyebrow reveal">Conectividad para todos</div>
    <h2 class="reveal d1">{{ config.rural_title }} <span class="grad">{{ config.rural_title_highlight }}</span></h2>
    <p class="reveal d2">{{ config.rural_description }}</p>
    <div class="pills reveal d2">
      {% for zone in config.zones_list %}<span>{{ zone }}</span>{% endfor %}
      <span>Hogares y comercios</span>
      <span>Instituciones</span>
      <span>Asesoría de cobertura</span>
    </div>
    <a class="btn reveal d3" href="#contacto">Consulta la cobertura</a>
  </div>
</section>
