services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: internetwork
      POSTGRES_USER: internetwork
      POSTGRES_PASSWORD: internetwork
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internetwork"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    # Las migraciones van en el arranque; el contenido se carga con
    # `python manage.py seed_site` a mano (nunca pisa lo editado en el admin).
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://internetwork:internetwork@db:5432/internetwork
      CACHE_URL: redis://redis:6379/0
      # En local no hay TLS delante: evita el bucle de redirección a HTTPS.
      SECURE_SSL_REDIRECT: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
